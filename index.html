<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oval, the Olin community</title>
<meta name="description" content="Oval: an interactive mockup of a community app for the Olin College of Engineering community. All people and posts are fictional sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F7FC}
a{color:#2443C9}a:hover{color:#1A2F8F}
button,input,select,textarea{font:inherit;color:inherit}
input[type=checkbox],input[type=radio]{accent-color:#2443C9}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2443C9;outline-offset:2px}
.row:hover{background:#EEF2FC}
.ghost:hover{background:#EDEFF3}
.chipbtn:hover{border-color:#2443C9}
.card{transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#AEB9E8;box-shadow:0 6px 20px rgba(17,24,39,.07)}
.pop .pav{transition:transform .15s}
.pop:hover .pav,.pop:focus-visible .pav{transform:scale(1.1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<script src="vue.global.prod.js"></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="app-template">
<div style="min-height: 100vh; background: #F5F7FC; color: #111827; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3E5EA; position: sticky; top: 0; z-index: 30">
<div style="max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 2.5vw, 28px); display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap">
<button @click="goHome" aria-label="Oval home" style="display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 0; cursor: pointer">
<svg width="32" height="20" viewBox="0 0 34 22" aria-hidden="true"><ellipse cx="17" cy="11" rx="15" ry="9" fill="none" stroke="#2443C9" stroke-width="3"></ellipse><circle cx="17" cy="11" r="3" fill="#2443C9"></circle></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Oval</span>
</button>
<div style="flex: 1 1 300px; min-width: 0; display: flex; align-items: center; gap: 10px; background: #F5F7FC; border: 1.5px solid #C4CAD6; border-radius: 12px; padding: 0 6px 0 14px; min-height: 46px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="q" class="sr">Search people</label>
<input id="q" type="search" autocomplete="off" :value="q" @input="onQ" placeholder="Search Oliners by name, skill, company, or club" style="flex: 1; min-width: 0; border: 0; background: transparent; font-size: 15.5px; padding: 10px 0">
<template v-if="hasQ">
<button @click="clearQ" aria-label="Clear search" class="ghost" style="width: 36px; height: 36px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</template>
</div>
<nav aria-label="Main" style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap">
<template v-for="t in nav">
<button class="ghost" @click="t.go" :aria-pressed="t.on" :aria-label="t.aria" :style="`display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; background: ${t.bg}; color: ${t.fg}`">{{t.label}}<template v-if="t.hasBadge"><span style="min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #2443C9; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{t.badge}}</span></template></button>
</template>
<span aria-label="Your account" style="width: 38px; height: 38px; border-radius: 50%; background: #111827; overflow: hidden; display: flex; margin-left: 4px">
<svg width="100%" height="100%" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg>
</span>
</nav>
</div>
</header>

<template v-if="isHome">
<div style="max-width: 1280px; margin: 0 auto; padding: 20px clamp(12px, 2.5vw, 28px) 0">
<figure style="margin: 0; position: relative; border-radius: 20px; overflow: hidden; border: 1px solid #E3E5EA; height: clamp(160px, 22vw, 280px); background: #DCE3F5">
<img src="olin-campus.jpg" alt="Olin College of Engineering's academic center on a sunny day" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 40%">
<figcaption style="position: absolute; left: 16px; bottom: 14px; display: flex; flex-direction: column; gap: 2px; background: rgba(255, 255, 255, 0.94); padding: 10px 14px; border-radius: 12px; box-shadow: 0 4px 16px rgba(17, 24, 39, 0.12)">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Welcome to the Oval</span>
<span style="font-size: 13px; color: #374151">Students, alumni, faculty and staff, all in one place.</span>
</figcaption>
</figure>
</div>
<div style="max-width: 1280px; margin: 0 auto; padding: 24px clamp(12px, 2.5vw, 28px) 64px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<main aria-label="Feed" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; text-align: center">What's new at Olin</h1>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px">
<label for="typeSel" class="sr">Type of post</label>
<select id="typeSel" :value="ftype" @change="onType" style="min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #C4CAD6; background: #FFFFFF; font-size: 14px; font-weight: 600">
<option value="all">All types</option>
<option value="project">Projects</option>
<option value="award">Wins &amp; awards</option>
<option value="startup">Startups</option>
<option value="event">Events</option>
<option value="news">School news</option>
</select>
<label for="groupSel" class="sr">Group</label>
<select id="groupSel" :value="fgroup" @change="onGroup" style="min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #C4CAD6; background: #FFFFFF; font-size: 14px; font-weight: 600">
<option value="all">All groups</option>
<option value="Olin Rocketry">Olin Rocketry</option>
<option value="Olin Electric Motorsports">Olin Electric Motorsports</option>
<option value="Olin Robotics Lab">Olin Robotics Lab</option>
<option value="Entrepreneurship Club">Entrepreneurship Club</option>
<option value="Sustainability Club">Sustainability Club</option>
<option value="Olin Hackathon">Olin Hackathon</option>
</select>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 3px 3px 10px; border: 1px dashed #C4CAD6; border-radius: 10px">
<span style="font-size: 12px; font-weight: 600; color: #4B5563">Preview as</span>
<span style="display: flex; gap: 2px; background: #EEF0F4; padding: 2px; border-radius: 8px">
<template v-for="va in viewAs">
<button @click="va.pick" :aria-pressed="va.on" :style="`min-height: 30px; padding: 0 10px; border-radius: 6px; border: 0; cursor: pointer; font-weight: 600; font-size: 12.5px; background: ${va.bg}; box-shadow: ${va.shadow}`">{{va.label}}</button>
</template>
</span>
</span>
</div>
</div>
<template v-if="isAlum">
<p style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; border: 1px solid #C9D3F3; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2443C9" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
<span>Your feed, in order: <strong>news from Olin</strong>, then <strong>{{followsText}}</strong>, then everything else.</span>
</p>
</template>
<template v-for="p in posts">
<article style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 18px; overflow: hidden">
<div style="padding: 18px 20px 0; display: flex; align-items: center; gap: 12px">
<button @click="p.openAuthor" :aria-label="p.authorAria" :style="`width: 44px; height: 44px; border-radius: 50%; background: ${p.authorFill}; border: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; padding: 0`">
<template v-if="p.isOrg">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"></path><path d="M5 10v9M9.5 10v9M14.5 10v9M19 10v9M3 20h18"></path></svg>
</template>
<template v-if="p.isPerson">
<svg width="100%" height="100%" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg>
</template>
</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 600; font-size: 15px">{{p.authorName}} <span :style="`font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: ${p.roleBg}; color: ${p.roleFg}; margin-left: 4px`">{{p.authorTag}}</span></span>
<span style="font-size: 13px; color: #4B5563">{{p.authorLine}} · {{p.time}}</span>
</div>
<span style="flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span :style="`font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: ${p.typeBg}; color: ${p.typeFg}`">{{p.typeLabel}}</span>
<template v-if="p.hasGroup">
<span style="font-size: 12px; color: #4B5563">{{p.group}}</span>
</template>
</span>
</div>
<div style="padding: 12px 20px 0">
<template v-if="p.showNote">
<p style="margin: 0 0 6px; font-size: 12.5px; font-weight: 600; color: #1E3AA8">{{p.noteText}}</p>
</template>
<h2 style="margin: 0 0 6px; font-family: 'Space Grotesk', sans-serif; font-size: 21px; line-height: 1.2; letter-spacing: -0.01em">{{p.title}}</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.6">{{p.body}}</p>
</div>
<div role="img" :aria-label="p.imgAlt" :style="`position: relative; margin: 14px 20px 0; height: 200px; border-radius: 14px; background: ${p.imgBg}; overflow: hidden`">
<span aria-hidden="true" :style="`position: absolute; width: 170px; height: 170px; border-radius: 50%; background: ${p.shapeA}; right: -30px; top: -50px; opacity: 0.8`"></span>
<span aria-hidden="true" :style="`position: absolute; width: 110px; height: 110px; border-radius: 26px; background: ${p.shapeB}; left: 30px; bottom: -34px; transform: rotate(-14deg); opacity: 0.8`"></span>
<span style="position: absolute; left: 12px; top: 12px; font-size: 12px; font-weight: 600; background: rgba(255, 255, 255, 0.92); border-radius: 999px; padding: 3px 10px; color: #374151">Photo · {{p.imgAlt}}</span>
</div>
<template v-if="p.hasEvent">
<div style="margin: 12px 20px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 14px; border: 1px solid #E3E5EA; border-radius: 12px; background: #F7F8FC">
<span style="font-weight: 700">{{p.eventWhen}}</span>
<span style="color: #4B5563">{{p.eventWhere}}</span>
<span style="flex: 1"></span>
<button @click="p.toggleGoing" :aria-pressed="p.going" :style="`min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid ${p.goingBd}; background: ${p.goingBg}; color: ${p.goingFg}; cursor: pointer; font-weight: 600`">{{p.goingLabel}}</button>
</div>
</template>

<template v-if="p.hasLink">
<div style="margin: 12px 20px 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #F2F5FD">
<span aria-hidden="true" style="display: flex; align-items: center; flex-shrink: 0">
<template v-for="ch in p.chain">
<template v-if="ch.dash"><span style="width: 16px; border-top: 2px dashed #8EA2D6"></span></template>
<span :style="`width: 26px; height: 26px; border-radius: 50%; background: ${ch.fill}; overflow: hidden; display: flex; box-shadow: 0 0 0 2px #FFFFFF`"><svg width="100%" height="100%" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg></span>
</template>
</span>
<span style="font-size: 13.5px; color: #1F2A52">{{p.linkText}}</span>
</div>
</template>

<template v-if="p.hasTags">
<div style="padding: 12px 20px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 13px; color: #4B5563; margin-right: 2px">With</span>
<template v-for="tg in p.tags">
<button @click="tg.open" class="chipbtn" style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px 0 3px; border-radius: 999px; border: 1px solid #D5D9E2; background: #FFFFFF; cursor: pointer; font-size: 13px; font-weight: 600">
<span :style="`width: 24px; height: 24px; border-radius: 50%; background: ${tg.fill}; overflow: hidden; display: flex`"><svg width="100%" height="100%" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg></span>
{{tg.name}}
</button>
</template>
</div>
</template>

<div style="padding: 12px 20px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<template v-for="rx in p.reactions">
<button @click="rx.toggle" :aria-pressed="rx.on" :aria-label="rx.aria" :style="`display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid ${rx.bd}; background: ${rx.bg}; color: ${rx.fg}; cursor: pointer; font-weight: 600; font-size: 13.5px`">
<svg width="16" height="16" viewBox="0 0 24 24" :fill="rx.fill" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path :d="rx.icon"></path></svg>
{{rx.label}} <span style="font-weight: 500">{{rx.count}}</span>
</button>
</template>
<button @click="p.toggleComments" :aria-expanded="p.commentsOpen" :style="`display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid #D5D9E2; background: ${p.cBtnBg}; cursor: pointer; font-weight: 600; font-size: 13.5px`">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4V5z"></path></svg>
{{p.commentLabel}}
</button>
<span style="flex: 1"></span>
<template v-if="p.canReach">
<button @click="p.reach" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: #2443C9; color: #FFFFFF; cursor: pointer; font-weight: 600">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3L10 14"></path><path d="M21 3l-7 18-4-7-7-4 18-7z"></path></svg>
{{p.reachLabel}}
</button>
</template>
</div>

<template v-if="p.commentsOpen">
<div style="border-top: 1px solid #E3E5EA; background: #FAFBFE; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 12px">
<template v-for="c in p.comments">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px; align-items: flex-start">
<span :style="`width: 32px; height: 32px; border-radius: 50%; background: ${c.fill}; overflow: hidden; display: flex; flex-shrink: 0`"><svg width="100%" height="100%" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg></span>
<div style="flex: 1; min-width: 0">
<div style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 4px 14px 14px 14px; padding: 8px 12px">
<span style="font-weight: 600; font-size: 13.5px">{{c.name}}</span> <span style="font-size: 12px; color: #4B5563">{{c.tag}}</span>
<p style="margin: 2px 0 0; font-size: 14px">{{c.text}}</p>
</div>
<button @click="c.reply" style="min-height: 30px; padding: 0 6px; border: 0; background: none; cursor: pointer; font-size: 12.5px; font-weight: 600; color: #2443C9">Reply</button>
</div>
</div>
<template v-for="rp in c.replies">
<div style="display: flex; gap: 10px; align-items: flex-start; margin-left: 42px">
<span :style="`width: 26px; height: 26px; border-radius: 50%; background: ${rp.fill}; overflow: hidden; display: flex; flex-shrink: 0`"><svg width="100%" height="100%" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg></span>
<div style="flex: 1; min-width: 0; background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 4px 14px 14px 14px; padding: 7px 12px">
<span style="font-weight: 600; font-size: 13px">{{rp.name}}</span> <span style="font-size: 12px; color: #4B5563">{{rp.tag}}</span>
<p style="margin: 2px 0 0; font-size: 13.5px">{{rp.text}}</p>
</div>
</div>
</template>
</div>
</template>
<template v-if="p.isReplying">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">Replying to {{p.replyName}} <button @click="p.cancelReply" style="min-height: 30px; padding: 0 8px; border: 0; background: none; color: #2443C9; font-weight: 600; cursor: pointer">Cancel</button></div>
</template>
<div style="display: flex; gap: 8px; align-items: center">
<label class="sr" :for="p.inputId">Write a comment</label>
<input :id="p.inputId" type="text" :value="p.draft" @input="p.onDraft" :placeholder="p.placeholder" style="flex: 1; min-width: 0; min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid #C4CAD6; background: #FFFFFF; font-size: 14px">
<button @click="p.postComment" style="min-height: 42px; padding: 0 16px; border-radius: 10px; border: 0; background: #2443C9; color: #FFFFFF; cursor: pointer; font-weight: 600">Post</button>
</div>
</div>
</template>
</article>
</template>
<template v-if="feedEmpty">
<p style="margin: 0; padding: 24px; border: 1px dashed #C4CAD6; border-radius: 16px; background: #FFFFFF; color: #4B5563">Nothing here yet.</p>
</template>
<p style="margin: 4px 0 0; text-align: center; font-size: 13px; color: #4B5563">You're caught up on the last two weeks. Prototype · every post and person is fictional sample data.</p>
</main>

<aside aria-label="Your community" style="flex: 1 1 290px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E3E5EA; border-radius: 18px; padding: 16px 16px 12px">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px">Your corner of Olin</h2>
<p style="margin: 2px 0 6px; font-size: 13px; color: #4B5563">{{cornerSub}}</p>
<div style="position: relative; width: 100%; aspect-ratio: 300 / 250">
<svg viewBox="0 0 300 250" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
<path :d="corner.dots" fill="#B9C6EA" fill-opacity="0.7"></path>
<path :d="corner.classP" fill="none" stroke="#334155" stroke-opacity="0.7" stroke-width="1.5"></path>
<path :d="corner.activityP" fill="none" stroke="#2443C9" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="5 4"></path>
<path :d="corner.companyP" fill="none" stroke="#0F766E" stroke-opacity="0.8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 4"></path>
</svg>
<span aria-hidden="true" style="position: absolute; left: 50%; top: 47.2%; transform: translate(-50%, -50%); width: 42px; height: 42px; border-radius: 50%; background: #111827; overflow: hidden; display: flex; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #2443C9; z-index: 2">
<svg width="100%" height="100%" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg>
</span>
<template v-for="cn in corner.nodes">
<button class="pop" @click="cn.open" :aria-label="cn.aria" :style="`position: absolute; left: ${cn.left}; top: ${cn.top}; transform: translate(-50%, -15px); z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; cursor: pointer`">
<span class="pav" :style="`width: 30px; height: 30px; border-radius: 50%; background: ${cn.fill}; overflow: hidden; display: flex; box-shadow: 0 0 0 2px #FFFFFF`"><svg width="100%" height="100%" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9.5" r="4.5" fill="#FFFFFF"></circle><ellipse cx="12" cy="24" rx="8.5" ry="7.5" fill="#FFFFFF"></ellipse></svg></span>
<span style="font-size: 11.5px; font-weight: 600; line-height: 1.2; background: rgba(255, 255, 255, 0.9); padding: 0 4px; border-radius: 4px; white-space: nowrap">{{cn.label}}</span>
</button>
</template>
</div>
